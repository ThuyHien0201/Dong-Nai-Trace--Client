kind = "mobile"
previewPath = "/mobile/"
title = "Đồng Nai Trace Mobile"
description = "Mobile companion app for the Đồng Nai Trace admin dashboard. Allows administrators to manage businesses, products, view analytics KPIs, synchronise data, and manage their account — all from a native mobile interface mirroring the web platform."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
